name: Refresh Small Cap Universe

on:
  schedule:
    - cron: "0 10 * * *"   # una vez al día (10:00 UTC = 05:00 America/Bogota)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Refrescar universo de tickers
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m src.refresh_universe

      - name: Commitear universe.csv y cache actualizados
        run: |
          git config user.name "smallcap-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add universe.csv state/ || true
          git diff --cached --quiet || git commit -m "chore: refresh small-cap universe [skip ci]"
          git push || true
